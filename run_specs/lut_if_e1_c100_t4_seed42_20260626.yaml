integrity:
  dataset_lock_verified: true
  matched_controls_verified: true
  all_failures_recorded: true
  no_silent_retry: true
  no_external_upload: true
  notes: >-
    Initial method proof of concept only. The registered full run failed its
    gates and must not be used as a positive paper claim. The result suggests
    this dense trainable LUT-IF training objective degrades paired fidelity
    under the fixed budget. Any second run requires a new causal diagnosis,
    not a hyperparameter, bit-width, checkpoint, stage, or seed search.
