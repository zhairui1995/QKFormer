schema_version: 1
run_id: rl_qklut_lif_policy_qkformer_c100_t4_seed42_20260630
status: planned
owner: codex
created_at: 2026-06-30

question:
  hypothesis: >
    A restricted RL/bandit policy that selects the LUT-LIF replacement variant
    per LIF group, using QK-LUT-inspired temporal/channel current normalization
    as one action, can outperform fixed all-posthoc, all-quantized, and all-CNL
    insertion policies on the retained QKFormer CIFAR-100 T=4 seed-42 setting.
  strongest_alternative_explanation: >
    The apparent benefit of CNL-LUT-LIF is local and setting-specific; a policy
    search over posthoc/quant/CNL actions may overfit the smoke subset or fail
    to beat the best fixed policy on full validation.
  claim_id_unlocked: planned_qklut_lif_architecture_policy_probe
  route_challenge_allowed: true

environment:
  host: server-lbz / 192.168.70.60
  ssh_target: lbz@192.168.70.60
  repo_root: /home/lbz/mac_agent/sdr-lutattn-qkformer-lut
  git_commit_or_snapshot: TO_VERIFY_AT_LAUNCH
  conda_environment: sdr
  python: /home/lbz/miniconda/envs/sdr/bin/python
  gpu_ids: [2]
  gpu_count: 1

protocol:
  dataset: CIFAR-100
  data_root: /home/datasets
  split: train calibration plus full validation for final full run
  manifest: torchvision CIFAR-100 under /home/datasets
  model: QKFormer CIFAR-100 T=4
  checkpoint: /home/lbz/pretrained_models/qk_lutformer_retained_20260619/qkformer_cifar100_t4_seed42_model_best.pth.tar
  method: QK-LUT-LIF Transformer policy probe; per-group action in {posthoc, quantized arithmetic LIF, CNL-LUT-LIF}
  controls:
    - all-posthoc dense transition LUT
    - all-quantized arithmetic LIF
    - all-CNL-LUT-LIF with temporal/channel current normalization
  seed: 42
  config_path: run_specs/rl_qklut_lif_policy_qkformer_c100_t4_seed42_20260630.yaml
  command_or_server_script: scripts/server/run_rl_lut_lif_policy_probe.sh
  fixed_budget:
    smoke:
      calibration_batches: 1
      search_eval_batches: 1
      final_eval_batches: 1
    full:
      calibration_batches: 128
      search_eval_batches: 8
      final_eval_batches: full validation
    policy_rounds: 1
    wall_time_limit: smoke first, full only after smoke pass
  search_prohibited:
    - bit_width_sweep
    - seed_sweep
    - checkpoint_sweep
    - learning_rate_sweep
    - backbone_search
    - retry_until_positive

metrics:
  primary:
    - paired Acc@1 drop versus teacher
    - reward = -drop_top1 - 0.01 * logit_mse_per_sample
  secondary:
    - logit MSE per sample
    - KL teacher-to-candidate per sample
    - selected policy by target
    - metadata bytes by action
    - module execution coverage
  snn_specific:
    - time_steps
    - LIF replacement coverage
    - aggregate clipping where available

gates:
  success:
    - smoke must execute all selected replacement modules with finite reward
    - full learned policy reward must exceed the best fixed-policy control reward
    - full learned policy paired Acc@1 drop must be <= 1.50 percentage points
  failure:
    - any non-finite metric
    - missing checkpoint or dataset
    - replacement module execution coverage below 100%
    - learned policy fails to beat the best fixed-policy control in full mode
  stop:
    - do not launch full run if smoke is not SMOKE-PASS
    - do not promote architecture claims from smoke subset metrics

artifacts:
  remote_result_dir: results/rl_qklut_lif_policy_cifar100_t4_seed42_<mode>_<timestamp>
  log_path: launcher.log
  summary_csv: summary.csv
  metrics_json: metrics.json
  report_md: report.md
  local_evidence_paths: []

integrity:
  dataset_lock_verified: true
  matched_controls_verified: planned
  all_failures_recorded: true
  no_silent_retry: true
  no_external_upload: false
  notes: >
    GitHub public code publication was explicitly authorized by the user on
    2026-06-30. Experimental claims remain planned until verified metrics are
    downloaded and audited.
