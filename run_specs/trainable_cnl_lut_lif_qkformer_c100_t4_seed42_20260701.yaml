schema_version: 1
run_id: trainable_cnl_lut_lif_qkformer_c100_t4_seed42_20260701
status: planned
owner: codex
created_at: 2026-07-01

question:
  hypothesis: >
    A trainable CNL-LUT-LIF module, initialized from QK-LUT-inspired
    temporal/channel current normalization and trained with a frozen QKFormer
    backbone, can improve over the fixed all-CNL-LUT-LIF control on the
    retained CIFAR-100 T=4 seed-42 setting.
  strongest_alternative_explanation: >
    CNL is only useful as a fixed calibration transform; making the transition
    table and CNL affine parameters trainable will overfit the limited training
    budget or degrade hard-address evaluation, as the previous Dense LUT-IF
    objective did.
  claim_id_unlocked: planned_trainable_qklut_lif_module_probe
  route_challenge_allowed: true

environment:
  host: server-lbz / 192.168.70.60
  ssh_target: lbz@192.168.70.60
  repo_root: /home/lbz/mac_agent/sdr-lutattn-qkformer-lut
  git_commit_or_snapshot: TO_VERIFY_AT_LAUNCH
  conda_environment: sdr
  python: /home/lbz/miniconda/envs/sdr/bin/python
  gpu_ids: [2]
  gpu_count: 1

protocol:
  dataset: CIFAR-100
  data_root: /home/datasets
  split: train for calibration/training; complete validation for full evidence
  model: QKFormer CIFAR-100 T=4
  checkpoint: /home/lbz/pretrained_models/qk_lutformer_retained_20260619/qkformer_cifar100_t4_seed42_model_best.pth.tar
  method: >
    Replace all MultiStepLIFNode modules with trainable dense LUT-IF
    transitions whose input current is first normalized by fixed CNL moments
    plus trainable temporal/channel affine parameters. Freeze the rest of the
    network and train transition tables, thresholds, and CNL affine parameters.
  controls:
    - original frozen LIF teacher
    - posthoc dense transition LUT
    - quantized arithmetic LIF
    - fixed all-CNL-LUT-LIF
    - trainable CNL-LUT-LIF initialization
  seed: 42
  config_path: run_specs/trainable_cnl_lut_lif_qkformer_c100_t4_seed42_20260701.yaml
  command_or_server_script: scripts/server/run_trainable_cnl_lut_lif_probe.sh
  fixed_budget:
    smoke:
      calibration_batches: 1
      epochs: 1
      train_batches_per_epoch: 1
      eval_batches: 1
    full:
      calibration_batches: 32
      epochs: 3
      train_batches_per_epoch: 128
      evaluation_samples: 10000
    wall_time_limit: smoke first, full only after smoke pass
  search_prohibited:
    - learning_rate_sweep
    - bit_width_sweep
    - seed_sweep
    - checkpoint_sweep
    - stage_sweep
    - retry_until_positive

metrics:
  primary:
    - full_validation_Acc_at_1
    - paired_Acc_at_1_drop
    - paired_logit_MSE_per_sample
  secondary:
    - teacher_to_candidate_KL_per_sample
    - validation_cross_entropy
    - table_delta_rms
    - norm_affine_delta
    - metadata_bytes
  snn_specific:
    - time_steps
    - all_LIF_replacement_execution_coverage
    - aggregate_clip_rate

gates:
  success:
    - smoke must execute all requested replacement modules and complete one backward update
    - full trainable CNL-LUT-LIF must beat fixed all-CNL-LUT-LIF on Acc@1 or logit MSE
    - full trainable CNL-LUT-LIF paired Acc@1 drop must be < fixed all-CNL-LUT-LIF drop
    - full paired Acc@1 drop must be <= 1.25 percentage points
  failure:
    - non-finite loss or metric
    - requested LIF target not executed
    - no improvement over fixed all-CNL-LUT-LIF
    - paired full-validation drop > 1.25 percentage points
  stop:
    - do not launch full if smoke is not SMOKE-PASS
    - stop after the registered full run; no hidden hyperparameter search

artifacts:
  remote_result_dir: results/trainable_cnl_lut_lif_cifar100_t4_seed42_<mode>_<timestamp>
  log_path: launcher.log
  summary_csv: summary.csv
  metrics_json: metrics.json
  report_md: report.md
  local_evidence_paths: []

integrity:
  dataset_lock_verified: true
  matched_controls_verified: planned
  all_failures_recorded: true
  no_silent_retry: true
  no_external_upload: true
  notes: >
    This is a causal follow-up to two NO-GO routes: dense trainable LUT-IF and
    selector-style RL. It tests a mechanism change, not a hyperparameter sweep.
