experiment: native_qklut_lif_attention_c100_t4_seed42
status: planned
date: 2026-07-01
claim:
  hypothesis: >
    Training QK-LUT-LIF as a native attention-neuron module from initialization
    is more credible than post-hoc frozen-backbone insertion because the
    upstream affine, normalization, attention, and classifier weights can adapt
    to hard-addressable LUT-LIF dynamics.
  strongest_alternative: >
    Any accuracy change may come from ordinary retraining noise or extra
    trainable table parameters rather than QK-LUT-inspired architecture.
  claim_unlocked_if_pass: >
    A native attention-scoped QK-LUT-LIF QKFormer variant can train end-to-end
    under the registered CIFAR-100 smoke/pilot protocol and deserves a full
    architecture comparison.
  forbidden_claims:
    - near-SOTA accuracy
    - superiority over QKFormer/Spikformer/LL-ViT
    - broad architecture transfer
    - hardware speed, energy, SRAM, area, or latency
    - success of post-hoc frozen-backbone LUT-LIF insertion
model:
  family: QKFormer
  dataset: CIFAR-100
  time_step: 4
  seed: 42
  native_module: QK-LUT-LIF attention LIF replacement
  target_scope: attention
  state_bits: 6
  input_bits: 8
  x_range: [-8.0, 8.0]
  v_range: [0.0, 2.0]
protocol:
  smoke:
    epochs: 1
    max_train_batches: 8
    max_eval_batches: 4
    batch_size: 16
    val_batch_size: 16
  pilot:
    epochs: 30
    max_train_batches: 0
    max_eval_batches: 0
    batch_size: 64
    val_batch_size: 64
  full:
    epochs: 400
    max_train_batches: 0
    max_eval_batches: 0
    batch_size: 64
    val_batch_size: 64
baselines:
  - original QKFormer trained with the same runner, seed, dataset, T, and budget
  - native QK-LUT-LIF attention variant
metrics:
  - train loss
  - validation Acc@1 and Acc@5
  - parameter count
  - QK-LUT-LIF module count and table entries
  - final checkpoint provenance
gate:
  smoke_pass:
    - both baseline and native variant complete without non-finite loss
    - native variant selects at least one attention LIF target
    - validation runs for the fixed smoke batches
  pilot_pass:
    - native best Acc@1 is no worse than 1.00 percentage point below the matched QKFormer baseline
    - native training has no non-finite loss
    - both rows use identical seed, augmentation, epoch, batch, and validation budgets
  full_pass:
    - native best Acc@1 is at least as high as the matched QKFormer baseline
    - full validation is complete
    - the result is repeated or justified before any near-SOTA language
no_sweep_policy:
  - do not change learning rate, bit widths, target scope, seed, checkpoint, or epoch budget after seeing smoke/pilot results without a new run spec
  - smoke is a feasibility gate, not evidence of accuracy improvement
artifacts:
  - result directory with train logs
  - args.yaml and summary.csv for each row
  - checkpoint_manifest.json
  - result memo under lut_if_paper/
