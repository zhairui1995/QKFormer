experiment:
  name: qkformer_lut_e2_replace
  seed: 42

model:
  family: cifar10
  checkpoint:
  time_step: 4
  layer: 4
  dim: 384
  num_heads: 8
  patch_size: 4
  mlp_ratio: 4
  img_size: 32
  in_channels: 3
  num_classes: 10

data:
  calibration:
    mode: cifar10
    data_dir: /media/data/spike-transformer-network/torch/cifar10/
    split: train
    batch_size: 32
    num_batches: 32
    workers: 4
  evaluation:
    mode: cifar10
    data_dir: /media/data/spike-transformer-network/torch/cifar10/
    split: validation
    batch_size: 32
    num_batches: 16
    workers: 4

diagnostic:
  device: cuda
  token_bins: 8
  channel_bins: 8
  population_bins: 4
  max_records_per_module_per_batch: 65536
  prototype_min_count: 2

replacement:
  mode: address_lut
  target_modules:
    - stage1.0.tssa
    - stage2.0.tssa
