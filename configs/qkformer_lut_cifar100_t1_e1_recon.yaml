experiment:
  name: qkformer_lut_cifar100_t1_e1_recon
  seed: 42

model:
  family: cifar100
  checkpoint:
  time_step: 1
  layer: 4
  dim: 384
  num_heads: 8
  patch_size: 4
  mlp_ratio: 4
  img_size: 32
  in_channels: 3
  num_classes: 100

data:
  calibration:
    mode: cifar100
    data_dir: data/cifar100
    split: train
    batch_size: 32
    num_batches: 32
    workers: 4
  evaluation:
    mode: cifar100
    data_dir: data/cifar100
    split: validation
    batch_size: 32
    num_batches: 16
    workers: 4

diagnostic:
  device: cuda
  token_bins: 8
  channel_bins: 8
  population_bins: 4
  max_records_per_module_per_batch: 65536
  prototype_min_count: 2
  response_source: proj_lif
  baselines:
    - global_mean
    - candidate_background_mean
    - token_channel_lut
    - shuffled_address_lut
    - address_lut
